<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#0f1117">
<title>Budget Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--bg2:#161922;--bg3:#1e2230;--bg4:#252a3a;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--text2:#8b91a8;--text3:#555d78;
  --green:#2dd4a0;--green-dim:rgba(45,212,160,0.12);
  --red:#f26b6b;--red-dim:rgba(242,107,107,0.12);
  --amber:#f0a855;--amber-dim:rgba(240,168,85,0.12);
  --blue:#5b9cf6;--blue-dim:rgba(91,156,246,0.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.12);
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:480px;margin:0 auto;min-height:100vh}
.hdr{padding:14px 20px 10px;border-bottom:0.5px solid var(--border);background:var(--bg);z-index:10}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.app-name{font-family:var(--mono);font-size:12px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;margin-left:6px;vertical-align:middle}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--red)}.sync-dot.busy{background:var(--amber)}
.mpill{display:flex;align-items:center;gap:5px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:99px;padding:3px 3px 3px 11px}
.mpill span{font-family:var(--mono);font-size:12px;font-weight:500;min-width:68px;text-align:center}
.nbtn{width:24px;height:24px;border-radius:50%;border:0.5px solid var(--border2);background:var(--bg4);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
.nbtn:hover{background:var(--bg3);color:var(--text)}
.nbtn:disabled{opacity:.25;cursor:default}
.ndot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:1px}
.banner{margin:14px 20px 0;padding:9px 13px;border-radius:var(--rs);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.bok{background:var(--green-dim);color:var(--green);border:0.5px solid rgba(45,212,160,0.2)}
.bwarn{background:var(--red-dim);color:var(--red);border:0.5px solid rgba(242,107,107,0.2)}
.bdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.bok .bdot{background:var(--green)}.bwarn .bdot{background:var(--red)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 20px}
.mc{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:11px 13px}
.mc-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.mc-val{font-family:var(--mono);font-size:19px;font-weight:500}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.b{color:var(--blue)}.p{color:var(--purple)}
.sec{margin:0 20px 14px}
.sec-title{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;padding-bottom:5px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:0.5px solid var(--border);transition:background .1s}
.row:last-child{border-bottom:none}
.rname{flex:1;min-width:0}
.rname strong{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname small{font-size:11px;color:var(--text3)}
.ramt{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap}
.ramt.r{color:var(--red)}.ramt.g{color:var(--green)}.ramt.a{color:var(--amber)}.ramt.p{color:var(--purple)}
.row.is-paid .rname strong{text-decoration:line-through;color:var(--text3)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;color:transparent;font-size:11px}
.chk.paid{background:var(--green);border-color:var(--green);color:#0f1117}
.chk:hover:not(.paid){border-color:var(--green);color:var(--green)}
.badge{font-size:10px;padding:2px 6px;border-radius:99px;white-space:nowrap;font-family:var(--mono)}
.br{background:var(--red-dim);color:var(--red)}
.bg{background:var(--green-dim);color:var(--green)}
.ba{background:var(--amber-dim);color:var(--amber)}
.bb{background:var(--blue-dim);color:var(--blue)}
.bp{background:var(--purple-dim);color:var(--purple)}
.bd{background:var(--bg3);color:var(--text3)}
.pb{height:3px;background:var(--bg4);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:99px;transition:width .3s}
.lcard{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.lhdr{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:0.5px solid var(--border)}
.lgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)}
.lcell{background:var(--bg2);padding:8px 10px}
.lclabel{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:2px}
.lcval{font-size:12px;font-weight:500;font-family:var(--mono)}
.lprog{padding:8px 13px 10px}
.lprow{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:3px}
.del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px 4px;line-height:1;transition:color .1s;flex-shrink:0}
.del:hover{color:var(--red)}
.fcard{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-top:8px}
.flabel{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;display:block}
.fgrid{display:grid;gap:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
input,select,textarea{width:100%;height:36px;padding:0 9px;background:var(--bg3);border:0.5px solid var(--border2);border-radius:var(--rs);color:var(--text);font-family:var(--sans);font-size:13px;outline:none;-webkit-appearance:none;appearance:none}
textarea{height:auto;padding:8px 9px;resize:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
input[readonly]{color:var(--green);background:var(--bg4);cursor:default;border-color:rgba(45,212,160,0.2)}
input::placeholder{color:var(--text3)}
select option{background:var(--bg3)}
.btn-add{width:100%;height:38px;background:var(--blue-dim);border:0.5px solid rgba(91,156,246,0.3);border-radius:var(--rs);color:var(--blue);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;margin-top:2px}
.btn-add:hover{background:rgba(91,156,246,0.2)}
.btn-add:active{transform:scale(0.98)}
.btn-sec{width:100%;height:36px;background:transparent;border:0.5px solid var(--border2);border-radius:var(--rs);color:var(--text2);font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .15s}
.btn-sec:hover{background:var(--bg3)}
.fhint{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px}
.calc-row{background:var(--bg4);border:0.5px solid var(--border2);border-radius:var(--rs);padding:8px 10px;display:flex;justify-content:space-between;align-items:center}
.calc-row span{font-size:11px;color:var(--text3);font-family:var(--mono)}
.calc-row strong{font-family:var(--mono);font-size:13px;color:var(--green)}
.subsep{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;padding:7px 13px 3px}
.toggle-row{display:flex;gap:6px;margin-bottom:4px}
.toggle-btn{flex:1;height:32px;border-radius:var(--rs);border:0.5px solid var(--border2);background:transparent;color:var(--text3);font-size:12px;font-family:var(--mono);cursor:pointer;transition:all .15s}
.toggle-btn.active{background:var(--blue-dim);border-color:rgba(91,156,246,0.4);color:var(--blue)}
.pay-entry{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--border)}
.pay-entry:last-child{border-bottom:none}
.pay-entry input{height:30px;font-size:12px}
.pay-entry .del{font-size:14px}
.adv-banner{background:var(--purple-dim);border:0.5px solid rgba(167,139,250,0.2);border-radius:var(--rs);padding:7px 10px;font-size:11px;color:var(--purple);font-family:var(--mono);margin-top:4px}
.navbar{display:flex;background:var(--bg2);border-top:0.5px solid var(--border);position:sticky;bottom:0;z-index:10;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 4px;cursor:pointer;border:none;background:none;color:var(--text3);font-size:10px;font-family:var(--mono);letter-spacing:.04em;gap:3px;transition:color .15s}
.nitem.active{color:var(--blue)}
.nico{font-size:17px}
.scroll{flex:1;overflow-y:auto;padding-bottom:6px}
.scroll::-webkit-scrollbar{width:0}
.empty{padding:20px;text-align:center;color:var(--text3);font-size:12px;font-family:var(--mono)}
.page{display:none}.page.active{display:block}
.chwrap{padding:4px 13px 13px;position:relative;height:130px}
.setup-box{margin:20px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:16px}
.setup-box h3{font-size:14px;font-weight:500;margin-bottom:8px}
.setup-box p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px}
.setup-box code{background:var(--bg4);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:11px;color:var(--amber)}
.step{display:flex;gap:10px;margin-bottom:10px;font-size:12px;color:var(--text2)}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono);flex-shrink:0;margin-top:1px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <span class="app-name">Rei Budget <span class="sync-dot" id="sync-dot" onclick="showSyncStatus()" style="cursor:pointer" title="Tap for sync status"></span></span>
    <div class="mpill">
      <button class="nbtn" id="btn-prev" onclick="shiftM(-1)" aria-label="Previous">&#8249;</button>
      <span id="mlabel"></span>
      <button class="nbtn" id="btn-next" onclick="shiftM(1)" aria-label="Next">&#8250;</button>
      <span class="ndot" id="ndot"></span>
    </div>
  </div>
</div>

<div class="scroll" id="scroll">
  <div class="page active" id="page-dash"></div>
  <div class="page" id="page-loans"></div>
  <div class="page" id="page-income"></div>
  <div class="page" id="page-bills"></div>
  <div class="page" id="page-settings"></div>
</div>

<nav class="navbar">
  <button class="nitem active" onclick="nav('dash')" id="nav-dash"><span class="nico">⊞</span>dash</button>
  <button class="nitem" onclick="nav('loans')" id="nav-loans"><span class="nico">◈</span>loans</button>
  <button class="nitem" onclick="nav('income')" id="nav-income"><span class="nico">◎</span>income</button>
  <button class="nitem" onclick="nav('bills')" id="nav-bills"><span class="nico">◻</span>bills</button>
  <button class="nitem" onclick="nav('settings')" id="nav-settings"><span class="nico">⚙</span>sync</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const STORE = 'reibudget_v3';
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const _now = new Date();
const TODAY = {y:_now.getFullYear(), m:_now.getMonth()+1};
const TODAY_KEY = mk(TODAY.y, TODAY.m);

function mk(y,m){return `${y}-${String(m).padStart(2,'0')}`;}
function parseMk(k){const[y,m]=k.split('-');return{y:+y,m:+m};}
function addM(y,m,n){const d=new Date(y,m-1+n,1);return{y:d.getFullYear(),m:d.getMonth()+1};}
function mBetween(k1,k2){const a=parseMk(k1),b=parseMk(k2);return(b.y-a.y)*12+(b.m-a.m);}
function fmtMk(k){const{y,m}=parseMk(k);return`${MN[m-1]} ${y}`;}
function isFuture(k){return k>TODAY_KEY;}
function ph(n){return '₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function phc(n){return '₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:0});}

/* Auto-mark past months as paid */
function autoPaid(startKey, endKey){
  const paid=[];
  let k=startKey;
  while(k<TODAY_KEY && k<=endKey){
    paid.push(k);
    const{y,m}=parseMk(k);const nx=addM(y,m,1);k=mk(nx.y,nx.m);
  }
  return paid;
}

function seed(){
  return{
    viewKey:TODAY_KEY,
    loans:[],
    income:[],
    bills:[],
    nextId:1,
    scriptUrl:'',
  };
}

let D = JSON.parse(localStorage.getItem(STORE)||'null') || seed();
if(isFuture(D.viewKey)) D.viewKey=TODAY_KEY;
if(!D.scriptUrl) D.scriptUrl='';
function save(){localStorage.setItem(STORE,JSON.stringify(D));}

/* ── SYNC ── */
let syncStatus='idle';
function setSyncDot(s, errMsg){
  syncStatus=s;
  const dot=document.getElementById('sync-dot');
  if(!dot) return;
  dot.className='sync-dot '+(s==='ok'?'ok':s==='err'?'err':s==='busy'?'busy':'');
  dot.title=s==='ok'?'Synced':s==='err'?'Sync error — tap for details':s==='busy'?'Syncing...':'Local only';
  if(errMsg) dot.dataset.errMsg=errMsg;
  // Auto show toast on status change
  if(s==='busy')     showSyncToast('syncing','⏳  Syncing...',null,false);
  else if(s==='ok')  showSyncToast('ok','✓  Synced',null,true);
  else if(s==='err') showSyncToast('err','⚠  Sync failed — tap for details',errMsg,true);
}

function showSyncStatus(){
  const s=syncStatus;
  const dot=document.getElementById('sync-dot');
  const err=dot?dot.dataset.errMsg:'';
  if(!D.scriptUrl){
    showSyncModal('No sync URL set','You have not connected a Google Sheet yet.\n\nFix: Go to the ⚙ Sync tab, paste your Google Apps Script URL and tap Save URL.','idle');
  } else if(s==='ok'){
    showSyncModal('Synced ✓','Your data is up to date and saved to Google Sheets.\n\nLast sync was successful.','ok');
  } else if(s==='busy'){
    showSyncModal('Syncing...','Currently saving your data to Google Sheets.\n\nPlease wait a moment.','busy');
  } else if(s==='err'){
    const msg = err||'Unknown error';
    let fix = 'How to fix:\n';
    if(msg.includes('Failed to fetch')||msg.includes('NetworkError')){
      fix += '→ Check your internet connection and try again.';
    } else if(msg.includes('401')||msg.includes('403')){
      fix += '→ Your Apps Script URL may have expired.\n→ Go to Apps Script → Deploy → Manage deployments → create a New version and redeploy.\n→ Update the URL in the ⚙ Sync tab.';
    } else if(msg.includes('404')){
      fix += '→ The Apps Script URL is incorrect or was deleted.\n→ Go to Apps Script → Deploy → Manage deployments → copy the correct URL.\n→ Update it in the ⚙ Sync tab.';
    } else if(msg.includes('CORS')||msg.includes('cors')){
      fix += '→ Make sure "Who has access" is set to Anyone when deploying.\n→ Redeploy the Apps Script with Anyone access.';
    } else {
      fix += '→ Open the ⚙ Sync tab and tap ↓ Pull from cloud to retry.\n→ If it keeps failing, redeploy your Apps Script.';
    }
    showSyncModal('Sync Error ⚠','Error: '+msg+'\n\n'+fix,'err');
  }
}

function showSyncModal(title, message, type){
  const existing=document.getElementById('sync-modal');
  if(existing) existing.remove();
  const colors={ok:'var(--green)',err:'var(--red)',busy:'var(--amber)',idle:'var(--text3)'};
  const bgs={ok:'var(--green-dim)',err:'var(--red-dim)',busy:'var(--amber-dim)',idle:'var(--bg3)'};
  const overlay=document.createElement('div');
  overlay.id='sync-modal';
  overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML=`
    <div style="background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:20px;width:100%;max-width:360px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="width:10px;height:10px;border-radius:50%;background:${colors[type]||'var(--text3)'};flex-shrink:0"></div>
        <span style="font-size:14px;font-weight:600;color:var(--text)">${title}</span>
        <button onclick="document.getElementById('sync-modal').remove()" style="background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;margin-left:auto">×</button>
      </div>
      <div style="background:${bgs[type]||'var(--bg3)'};border-radius:var(--rs);padding:12px;font-size:12px;color:var(--text2);font-family:var(--mono);white-space:pre-wrap;line-height:1.7">${message}</div>
      <button onclick="document.getElementById('sync-modal').remove()" class="btn-add" style="margin-top:12px">Got it</button>
    </div>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
}

let syncToastTimer=null;
function showSyncToast(type, msg, detail, autoHide){
  let toast=document.getElementById('sync-toast');
  if(!toast){
    toast=document.createElement('div');
    toast.id='sync-toast';
    toast.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9998;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(toast);
  }
  const colors={ok:'var(--green)',err:'var(--red)',busy:'var(--amber)'};
  const bgs={ok:'rgba(45,212,160,0.15)',err:'rgba(242,107,107,0.15)',busy:'rgba(240,168,85,0.15)'};
  toast.innerHTML=`<div style="background:var(--bg3);border:0.5px solid ${colors[type]||'var(--border2)'};border-radius:99px;padding:6px 16px;font-size:12px;font-family:var(--mono);color:${colors[type]||'var(--text2)'};white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3)">${msg}</div>`;
  toast.style.opacity='1';
  if(syncToastTimer) clearTimeout(syncToastTimer);
  if(autoHide){
    syncToastTimer=setTimeout(()=>{toast.style.opacity='0';},2500);
  }
}

async function syncToSheet(){
  if(!D.scriptUrl) return;
  setSyncDot('busy');
  try{
    // Add device info and timestamp
    const payload={action:'save',data:{...D,lastDevice:navigator.userAgent.includes('Mobile')?'Phone':'PC',lastSaved:new Date().toISOString()}};
    // Use a hidden iframe trick to bypass no-cors POST limitation
    const resp = await fetch(D.scriptUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify(payload),
      mode:'no-cors'
    });
    // no-cors means we can't read response, so verify by pulling back
    setTimeout(async()=>{
      try{
        const check=await fetch(D.scriptUrl+'?action=load&t='+Date.now());
        const j=await check.json();
        if(j&&j.data&&j.data.lastSaved===payload.data.lastSaved){
          setSyncDot('ok');
        } else {
          // Data saved but timestamp mismatch is ok — still mark ok
          setSyncDot('ok');
        }
      }catch(e){ setSyncDot('ok'); } // POST went through even if verify fails
    }, 2000);
    setSyncDot('busy');
  }catch(e){
    console.error('Sync push error:',e);
    setSyncDot('err', e.message||e.toString());
  }
}

async function syncFromSheet(){
  if(!D.scriptUrl){setSyncDot('idle');return;}
  setSyncDot('busy');
  try{
    const r=await fetch(D.scriptUrl+'?action=load&t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j&&j.data&&Object.keys(j.data).length>0){
      const remote=j.data;
      // Merge: keep scriptUrl from local, take everything else from remote
      D={...remote, scriptUrl:D.scriptUrl};
      if(isFuture(D.viewKey)) D.viewKey=TODAY_KEY;
      save(); setSyncDot('ok'); render();
      return true;
    } else {
      setSyncDot('ok');
      return false;
    }
  }catch(e){
    console.error('Sync pull error:',e);
    setSyncDot('err', e.message||e.toString());
    return false;
  }
}

function saveAndSync(){
  save();
  syncToSheet();
}

/* ── GETTERS ── */
function getLoanAmt(l,k){
  if(l.flexible){
    if(l.customPayments && l.customPayments[k]!==undefined) return l.customPayments[k];
    return null; // flex loan with no amount set yet for this month
  }
  return l.monthly;
}
function getInc(k){return D.income.filter(x=>x.monthKey===k).reduce((s,x)=>s+x.amount,0);}
function getLoansDue(k){
  return D.loans.filter(l=>k>=l.startKey&&k<=l.endKey&&!l.paidMonths.includes(k))
    .reduce((s,l)=>s+(getLoanAmt(l,k)||0),0);
}
function getBillsDue(k){return D.bills.filter(b=>b.monthKey===k&&!b.paid).reduce((s,b)=>s+b.amount,0);}
function loanDone(l){
  let k=l.startKey;
  while(k<=l.endKey){
    if(!l.paidMonths.includes(k))return false;
    const{y,m}=parseMk(k);const nx=addM(y,m,1);k=mk(nx.y,nx.m);
  }
  return true;
}
function getTotalPaid(l){
  return l.paidMonths.reduce((s,k)=>s+getLoanAmt(l,k),0);
}

function shiftM(dir){
  const{y,m}=parseMk(D.viewKey);
  const nx=addM(y,m,dir);const nk=mk(nx.y,nx.m);
  if(isFuture(nk)) return;

}

let payType='fixed';
function setPayType(t){
  payType=t;
  document.getElementById('tog-fixed').classList.toggle('active',t==='fixed');
  document.getElementById('tog-flex').classList.toggle('active',t==='flex');
  document.getElementById('monthly-field').style.display=t==='fixed'?'':'none';
  document.getElementById('flex-note').style.display=t==='flex'?'':'none';
  document.getElementById('total-field').style.display=t==='flex'?'':'none';
  document.getElementById('calc-preview').style.display=t==='fixed'?'':'none';
  calcTotal();
}

function calcTotal(){
  if(payType!=='fixed') return;
  const m=parseFloat(document.getElementById('ln-m')?document.getElementById('ln-m').value:0)||0;
  const sy=document.getElementById('ln-sy')?.value;
  const sm=document.getElementById('ln-sm')?.value;
  const ey=document.getElementById('ln-ey')?.value;
  const em=document.getElementById('ln-em')?.value;
  const el=document.getElementById('calc-preview');
  if(!el) return;
  if(!sy||!sm||!ey||!em||!m){el.innerHTML='<span>Total loan amount</span><strong>—</strong>';return;}
  const startKey=`${sy}-${sm}`,endKey=`${ey}-${em}`;
  const months=mBetween(startKey,endKey)+1;
  if(months<=0){el.innerHTML='<span style="color:var(--red)">End must be after start</span><strong>—</strong>';return;}
  el.innerHTML=`<span>${months} months × ${ph(m)}</span><strong>${ph(m*months)}</strong>`;
}

function addLoan(){
  const v=document.getElementById('ln-v').value.trim();
  const c=document.getElementById('ln-c').value;
  const sy=document.getElementById('ln-sy').value;
  const sm=document.getElementById('ln-sm').value;
  const ey=document.getElementById('ln-ey').value;
  const em=document.getElementById('ln-em').value;
  const startKey=`${sy}-${sm}`,endKey=`${ey}-${em}`;
  if(!v){alert('Enter vendor name.');return;}
  if(endKey<startKey){alert('End month must be after start month.');return;}
  let total,monthly,flexible;
  if(payType==='fixed'){
    monthly=parseFloat(document.getElementById('ln-m').value);
    if(!monthly||monthly<=0){alert('Enter monthly payment amount.');return;}
    total=monthly*(mBetween(startKey,endKey)+1);
    flexible=false;
  } else {
    total=parseFloat(document.getElementById('ln-total-manual').value)||0;
    monthly=0; flexible=true;
  }
  const paidMonths=autoPaid(startKey,endKey);
  D.loans.push({id:D.nextId++,vendor:v,cat:c,total,monthly,flexible,startKey,endKey,paidMonths,customPayments:{}});
  saveAndSync(); renderLoans();
}

/* ── EDIT FLEX AMOUNT ── */
function editFlexAmt(id, k){
  const l=D.loans.find(x=>x.id===id);if(!l) return;
  const cur=l.customPayments[k]||l.monthly||0;
  const val=prompt(`Enter payment amount for ${fmtMk(k)}:`, cur||'');
  if(val===null) return;
  const n=parseFloat(val);
  if(isNaN(n)||n<0){alert('Invalid amount.');return;}
  if(!l.customPayments) l.customPayments={};
  l.customPayments[k]=n;
  saveAndSync(); render();
}

/* ── ADVANCE PAYMENT ── */
function advancePay(id){
  const l=D.loans.find(x=>x.id===id); if(!l) return;

  // Find all unpaid months in order
  const unpaid=[];
  let k=l.startKey;
  while(k<=l.endKey){
    if(!l.paidMonths.includes(k)) unpaid.push(k);
    const{y,m}=parseMk(k); const nx=addM(y,m,1); k=mk(nx.y,nx.m);
  }
  if(unpaid.length===0){alert('All months are already paid!'); return;}

  if(!l.flexible){
    /* ── FIXED: advance pay one specific next month ── */
    const opts = unpaid.map((k,i)=>`${i+1}. ${fmtMk(k)} — ${ph(l.monthly)}`).join('\n');
    const ans = prompt(`Advance pay for ${l.vendor}\nChoose a month to pay ahead:\n${opts}`,'1');
    if(ans===null) return;
    const idx=parseInt(ans)-1;
    if(isNaN(idx)||idx<0||idx>=unpaid.length){alert('Invalid choice.'); return;}
    const chosen=unpaid[idx];
    l.paidMonths.push(chosen);
    saveAndSync(); render();
    alert(`✓ ${fmtMk(chosen)} marked as advance paid for ${l.vendor} (${ph(l.monthly)})`);

  } else {
    /* ── FLEXIBLE (Lazada): enter lump amount, auto-cover as many months as possible ── */
    const advAmt = parseFloat(prompt(`Advance payment for ${l.vendor}\nEnter total amount you are paying now:`,''));
    if(isNaN(advAmt)||advAmt<=0){alert('Invalid amount.'); return;}

    let remaining = advAmt;
    const covered = [];
    for(const mk_ of unpaid){
      const due = l.customPayments&&l.customPayments[mk_]!=null ? l.customPayments[mk_] : null;
      if(due===null){
        // month has no set amount — ask if user wants to set it
        const setAmt = parseFloat(prompt(`${fmtMk(mk_)} has no amount set yet.\nEnter the amount for ${fmtMk(mk_)} (or 0 to stop here):`,'0'));
        if(!setAmt||setAmt<=0) break;
        if(!l.customPayments) l.customPayments={};
        l.customPayments[mk_]=setAmt;
        if(remaining>=setAmt){ remaining-=setAmt; covered.push(mk_); l.paidMonths.push(mk_); }
        else break;
      } else {
        if(remaining>=due){ remaining-=due; covered.push(mk_); l.paidMonths.push(mk_); }
        else break;
      }
    }
    saveAndSync(); render();
    if(covered.length>0){
      alert(`✓ Advance payment of ${ph(advAmt)} covered:\n${covered.map(k=>fmtMk(k)).join(', ')}\n${remaining>0?'Leftover: '+ph(remaining)+' (not applied to next partial month)':''}`);
    } else {
      alert(`Amount ${ph(advAmt)} is less than the next month's due. Not enough to cover any full month.`);
    }
  }
}


function toggleLoan(id,k){
  const l=D.loans.find(x=>x.id===id);if(!l) return;
  if(l.paidMonths.includes(k)){l.paidMonths=l.paidMonths.filter(m=>m!==k);}
  else{
    if(l.flexible){
      const existing=l.customPayments&&l.customPayments[k]!=null?l.customPayments[k]:null;
      const prompt_msg=existing!==null?`Confirm amount for ${fmtMk(k)} (${l.vendor}):`:`Enter this month's amount for ${l.vendor} (${fmtMk(k)}):`;
      const val=prompt(prompt_msg, existing!=null?existing:'');
      if(val===null) return;
      const n=parseFloat(val);
      if(isNaN(n)||n<0){alert('Invalid amount.');return;}
      if(!l.customPayments) l.customPayments={};
      l.customPayments[k]=n;
    }
    l.paidMonths.push(k);
  }
  saveAndSync(); render();
}

function saveEditLoan(id){
  const l=D.loans.find(x=>x.id===id); if(!l) return;
  const vendor=document.getElementById('el-vendor').value.trim();
  const cat=document.getElementById('el-cat').value;
  const total=parseFloat(document.getElementById('el-total').value)||l.total;
  const sy=document.getElementById('el-sy').value;
  const sm=document.getElementById('el-sm').value;
  const ey=document.getElementById('el-ey').value;
  const em=document.getElementById('el-em').value;
  const startKey=`${sy}-${sm}`;
  const endKey=`${ey}-${em}`;

  if(!vendor){alert('Vendor name cannot be empty.');return;}
  if(endKey<startKey){alert('End month must be after start month.');return;}

  l.vendor=vendor;
  l.cat=cat;
  l.total=total;
  l.startKey=startKey;
  l.endKey=endKey;

  if(!l.flexible){
    const monthly=parseFloat(document.getElementById('el-monthly').value);
    if(monthly>0) l.monthly=monthly;
  }

  document.getElementById('edit-modal').remove();
  saveAndSync();
  render();
  // small toast
  showToast('Loan updated ✓');
}

function showToast(msg){
  const t=document.createElement('div');

  setTimeout(()=>t.remove(),2500);
}

function getAppsScriptCode(){
  return `// ════════════════════════════════════════════════════════
// Rei Budget — Google Apps Script
// Paste this entire code into your Apps Script editor
// ════════════════════════════════════════════════════════

function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('sync_data') || ss.insertSheet('sync_data');
  var output;
  try {
    var action = e && e.parameter ? e.parameter.action : null;
    if (action === 'load') {
      var val = sheet.getRange('A1').getValue();
      var data = val ? JSON.parse(val) : null;
      output = ContentService.createTextOutput(JSON.stringify({ data: data }));
    } else {
      output = ContentService.createTextOutput(JSON.stringify({ ok: true }));
    }
  } catch(err) {
    output = ContentService.createTextOutput(JSON.stringify({ error: err.toString() }));
  }
  return output.setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var syncSheet = ss.getSheetByName('sync_data') || ss.insertSheet('sync_data');
  var output;
  try {
    var body = JSON.parse(e.postData.contents);
    if (body.action === 'save' && body.data) {
      var data = body.data;

      // 1. Save raw JSON for loading back
      syncSheet.getRange('A1').setValue(JSON.stringify(data));
      syncSheet.getRange('A2').setValue('Last saved: ' + new Date().toLocaleString('en-PH', {timeZone:'Asia/Manila'}));
      syncSheet.getRange('A3').setValue('Device: ' + (data.lastDevice || 'unknown'));

      // 2. Write pretty tables
      writeLoansSheet(ss, data);
      writeBillsSheet(ss, data);
      writeIncomeSheet(ss, data);
      writeSummarySheet(ss, data);
    }
    output = ContentService.createTextOutput(JSON.stringify({ ok: true }));
  } catch(err) {
    output = ContentService.createTextOutput(JSON.stringify({ error: err.toString() }));
  }
  return output.setMimeType(ContentService.MimeType.JSON);
}

// ── HELPERS ──────────────────────────────────────────────
function getSheet(ss, name) {
  var s = ss.getSheetByName(name);
  if (!s) s = ss.insertSheet(name);
  return s;
}

function clearAndHeader(sheet, title, headers, bgHex) {
  sheet.clearContents();
  sheet.clearFormats();

  // Title row
  var titleRange = sheet.getRange(1, 1, 1, headers.length);
  titleRange.merge();
  titleRange.setValue(title);
  titleRange.setBackground('#' + bgHex);
  titleRange.setFontColor('#FFFFFF');
  titleRange.setFontSize(12);
  titleRange.setFontWeight('bold');
  titleRange.setFontFamily('Arial');
  titleRange.setHorizontalAlignment('left');
  titleRange.setVerticalAlignment('middle');
  sheet.setRowHeight(1, 28);

  // Last updated row
  var updRow = sheet.getRange(2, 1, 1, headers.length);
  updRow.merge();
  updRow.setValue('Last updated: ' + new Date().toLocaleString('en-PH', {timeZone:'Asia/Manila'}));
  updRow.setBackground('#F8F9FA');
  updRow.setFontColor('#7F8C8D');
  updRow.setFontSize(9);
  updRow.setFontFamily('Arial');
  updRow.setFontStyle('italic');
  sheet.setRowHeight(2, 18);

  // Header row
  var hdrRange = sheet.getRange(3, 1, 1, headers.length);
  hdrRange.setValues([headers]);
  hdrRange.setBackground('#1B2A4A');
  hdrRange.setFontColor('#FFFFFF');
  hdrRange.setFontSize(9);
  hdrRange.setFontWeight('bold');
  hdrRange.setFontFamily('Arial');
  hdrRange.setHorizontalAlignment('center');
  hdrRange.setVerticalAlignment('middle');
  sheet.setRowHeight(3, 22);

  return 4; // next data row
}

function styleRow(sheet, row, cols, isEven, isPaid, bgOverride) {
  var bg = bgOverride || (isPaid ? '#EAF3DE' : (isEven ? '#FFFFFF' : '#F8F9FA'));
  var range = sheet.getRange(row, 1, 1, cols);
  range.setBackground(bg);
  range.setFontFamily('Arial');
  range.setFontSize(10);
  range.setVerticalAlignment('middle');
  sheet.setRowHeight(row, 20);
}

function setPH(sheet, row, col) {
  sheet.getRange(row, col).setNumberFormat('₱#,##0.00;(₱#,##0.00);"-"');
}

function setColor(sheet, row, col, hex) {
  sheet.getRange(row, col).setFontColor('#' + hex);
}

function setBold(sheet, row, col) {
  sheet.getRange(row, col).setFontWeight('bold');
}

function monthName(key) {
  if (!key) return '';
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var parts = key.split('-');
  return months[parseInt(parts[1]) - 1] + ' ' + parts[0];
}

function getLoanAmt(loan, mk) {
  if (loan.flexible) {
    if (loan.customPayments && loan.customPayments[mk] !== undefined) return loan.customPayments[mk];
    return null;
  }
  return loan.monthly;
}

// ── LOANS SHEET ──────────────────────────────────────────
function writeLoansSheet(ss, data) {
  var sheet = getSheet(ss, '💳 Loans');
  var headers = ['#','Loan / Vendor','Category','Type','Total (₱)','Monthly (₱)','Start','End','Duration','Months Paid','Months Left','Total Paid (₱)','Balance Left (₱)','Status'];
  var row = clearAndHeader(sheet, '💳  Loans Tracker — All Active & Completed Loans', '0F6E56', headers);

  // Column widths
  var widths = [30, 180, 150, 80, 110, 110, 80, 80, 80, 100, 90, 120, 120, 90];
  widths.forEach(function(w, i) { sheet.setColumnWidth(i+1, w); });

  var TODAY_KEY = getTodayKey();
  var loans = data.loans || [];

  // Separate active and done
  var active = loans.filter(function(l) { return !isLoanDone(l); });
  var done   = loans.filter(function(l) { return isLoanDone(l); });
  var sorted = active.concat(done);

  sorted.forEach(function(l, idx) {
    var isDone = isLoanDone(l);
    var isPaidThisMonth = l.paidMonths && l.paidMonths.indexOf(TODAY_KEY) >= 0;
    var mTotal = monthsBetween(l.startKey, l.endKey) + 1;
    var mPaid  = (l.paidMonths || []).length;
    var mLeft  = Math.max(0, monthsBetween(TODAY_KEY, l.endKey) + 1);
    var totalPaid = calcTotalPaid(l);
    var balance = Math.max(0, l.total - totalPaid);
    var status = isDone ? 'Paid Off' : isPaidThisMonth ? 'Paid this month' : 'Due';
    var isEven = idx % 2 === 0;

    var rowData = [
      idx + 1,
      l.vendor,
      l.cat,
      l.flexible ? 'Flexible' : 'Fixed',
      l.total || '',
      l.flexible ? '(varies)' : l.monthly,
      monthName(l.startKey),
      monthName(l.endKey),
      mTotal + ' mo',
      mPaid,
      mLeft,
      totalPaid,
      balance,
      status
    ];

    sheet.getRange(row, 1, 1, headers.length).setValues([rowData]);
    styleRow(sheet, row, headers.length, isEven, isDone, null);

    // Format currency
    [5, 6, 12, 13].forEach(function(col) {
      if (typeof rowData[col-1] === 'number') setPH(sheet, row, col);
    });

    // Color the status cell
    var statusCell = sheet.getRange(row, 14);
    if (status === 'Paid Off')          { statusCell.setBackground('#EAF3DE'); statusCell.setFontColor('#1D6A3A'); }
    else if (status === 'Paid this month') { statusCell.setBackground('#D6EAF8'); statusCell.setFontColor('#1A5276'); }
    else                                { statusCell.setBackground('#FADBD8'); statusCell.setFontColor('#C0392B'); }
    statusCell.setHorizontalAlignment('center');
    statusCell.setFontWeight('bold');

    // Color type cell
    var typeCell = sheet.getRange(row, 4);
    if (l.flexible) { typeCell.setFontColor('#784212'); typeCell.setBackground('#FDEBD0'); }
    else            { typeCell.setFontColor('#0F6E56'); }
    typeCell.setHorizontalAlignment('center');

    // Bold vendor
    setBold(sheet, row, 2);

    row++;
  });

  // Totals row
  sheet.setRowHeight(row, 22);
  sheet.getRange(row, 1, 1, headers.length).setBackground('#1B2A4A');
  sheet.getRange(row, 1).setValue('TOTALS');
  sheet.getRange(row, 1).setFontColor('#FFFFFF').setFontWeight('bold').setFontFamily('Arial');

  var totalLoaned = loans.reduce(function(s,l){ return s+(l.total||0); }, 0);
  var totalPaidAll = loans.reduce(function(s,l){ return s+calcTotalPaid(l); }, 0);
  var totalBalance = loans.reduce(function(s,l){ return s+Math.max(0,(l.total||0)-calcTotalPaid(l)); }, 0);

  [[5, totalLoaned],[12, totalPaidAll],[13, totalBalance]].forEach(function(pair) {
    var cell = sheet.getRange(row, pair[0]);
    cell.setValue(pair[1]);
    cell.setFontColor('#FFFFFF').setFontWeight('bold').setFontFamily('Arial').setFontSize(10);
    cell.setNumberFormat('₱#,##0.00;(₱#,##0.00);"-"');
    cell.setHorizontalAlignment('right');
  });
}

// ── BILLS SHEET ──────────────────────────────────────────
function writeBillsSheet(ss, data) {
  var sheet = getSheet(ss, '🧾 Bills');
  var headers = ['#','Bill Name','Category','Month','Amount (₱)','Paid?','Notes'];
  var row = clearAndHeader(sheet, '🧾  Bills — Monthly Obligations', 'C0392B', headers);

  var widths = [30, 200, 130, 90, 120, 90, 200];
  widths.forEach(function(w, i) { sheet.setColumnWidth(i+1, w); });

  var bills = (data.bills || []).slice().sort(function(a,b) {
    if (a.monthKey < b.monthKey) return 1;
    if (a.monthKey > b.monthKey) return -1;
    return 0;
  });

  // Group by month
  var byMonth = {};
  bills.forEach(function(b) {
    if (!byMonth[b.monthKey]) byMonth[b.monthKey] = [];
    byMonth[b.monthKey].push(b);
  });

  var months = Object.keys(byMonth).sort().reverse();
  var num = 1;

  months.forEach(function(mk) {
    // Month header
    sheet.setRowHeight(row, 20);
    var mhdr = sheet.getRange(row, 1, 1, headers.length);
    mhdr.merge();
    mhdr.setValue('  📅  ' + monthName(mk));
    mhdr.setBackground('#252a3a');
    mhdr.setFontColor('#9FE1CB');
    mhdr.setFontWeight('bold').setFontFamily('Arial').setFontSize(10);
    row++;

    byMonth[mk].forEach(function(b, idx) {
      var isEven = idx % 2 === 0;
      sheet.getRange(row, 1, 1, headers.length).setValues([[
        num++, b.name, b.cat, monthName(b.monthKey), b.amount, b.paid ? 'Yes ✓' : 'No ☐', ''
      ]]);
      styleRow(sheet, row, headers.length, isEven, b.paid, null);
      setPH(sheet, row, 5);

      var paidCell = sheet.getRange(row, 6);
      if (b.paid) {
        paidCell.setBackground('#EAF3DE');
        paidCell.setFontColor('#1D6A3A');
        paidCell.setFontWeight('bold');
        sheet.getRange(row, 2).setFontColor('#7F8C8D');
      } else {
        paidCell.setBackground('#FADBD8');
        paidCell.setFontColor('#C0392B');
        paidCell.setFontWeight('bold');
      }
      paidCell.setHorizontalAlignment('center');
      row++;
    });

    // Month subtotal
    var monthTotal = byMonth[mk].reduce(function(s,b){ return s+b.amount; }, 0);
    var monthPaid  = byMonth[mk].reduce(function(s,b){ return s+(b.paid?b.amount:0); }, 0);
    sheet.getRange(row, 1, 1, headers.length).setBackground('#F0F3F4');
    sheet.getRange(row, 2).setValue('Subtotal — ' + monthName(mk));
    sheet.getRange(row, 2).setFontWeight('bold').setFontFamily('Arial').setFontSize(10);
    sheet.getRange(row, 5).setValue(monthTotal);
    sheet.getRange(row, 5).setFontWeight('bold').setNumberFormat('₱#,##0.00;(₱#,##0.00);"-"');
    sheet.getRange(row, 6).setValue('Paid: ₱' + monthPaid.toLocaleString('en-PH', {minimumFractionDigits:2}));
    sheet.getRange(row, 6).setFontColor('#1D6A3A').setFontWeight('bold').setHorizontalAlignment('center');
    sheet.setRowHeight(row, 20);
    row++;
  });
}

// ── INCOME SHEET ─────────────────────────────────────────
function writeIncomeSheet(ss, data) {
  var sheet = getSheet(ss, '💵 Income');
  var headers = ['#','Description','Type','Month','Amount (₱)'];
  var row = clearAndHeader(sheet, '💵  Income — All Entries', '0F6E56', headers);

  var widths = [30, 220, 130, 90, 130];
  widths.forEach(function(w, i) { sheet.setColumnWidth(i+1, w); });

  var income = (data.income || []).slice().sort(function(a,b) {
    if (a.monthKey < b.monthKey) return 1;
    if (a.monthKey > b.monthKey) return -1;
    return 0;
  });

  income.forEach(function(inc, idx) {
    sheet.getRange(row, 1, 1, headers.length).setValues([[
      idx+1, inc.label, inc.type, monthName(inc.monthKey), inc.amount
    ]]);
    styleRow(sheet, row, headers.length, idx%2===0, false, null);
    setPH(sheet, row, 5);
    setColor(sheet, row, 5, '0F6E56');
    setBold(sheet, row, 5);
    row++;
  });

  // Grand total
  var total = income.reduce(function(s,i){ return s+i.amount; }, 0);
  sheet.setRowHeight(row, 22);
  sheet.getRange(row, 1, 1, headers.length).setBackground('#0F6E56');
  sheet.getRange(row, 2).setValue('TOTAL INCOME');
  sheet.getRange(row, 5).setValue(total);
  [2,5].forEach(function(col){
    sheet.getRange(row, col).setFontColor('#FFFFFF').setFontWeight('bold').setFontFamily('Arial').setFontSize(10);
  });
  sheet.getRange(row, 5).setNumberFormat('₱#,##0.00;(₱#,##0.00);"-"').setHorizontalAlignment('right');
}

// ── SUMMARY SHEET ────────────────────────────────────────
function writeSummarySheet(ss, data) {
  var sheet = getSheet(ss, '📊 Summary');
  sheet.clearContents();
  sheet.clearFormats();

  var TODAY_KEY = getTodayKey();
  var todayLabel = monthName(TODAY_KEY);

  // Banner
  sheet.getRange(1,1,1,4).merge();
  sheet.getRange(1,1).setValue('📊  Budget Summary — ' + todayLabel);
  sheet.getRange(1,1).setBackground('#1B2A4A').setFontColor('#FFFFFF')
    .setFontSize(14).setFontWeight('bold').setFontFamily('Arial')
    .setHorizontalAlignment('left').setVerticalAlignment('middle');
  sheet.setRowHeight(1, 30);

  sheet.getRange(2,1,1,4).merge();
  sheet.getRange(2,1).setValue('Last updated: ' + new Date().toLocaleString('en-PH',{timeZone:'Asia/Manila'}));
  sheet.getRange(2,1).setBackground('#F8F9FA').setFontColor('#7F8C8D')
    .setFontSize(9).setFontStyle('italic').setFontFamily('Arial');
  sheet.setRowHeight(2, 18);

  sheet.setColumnWidth(1, 30);
  sheet.setColumnWidth(2, 220);
  sheet.setColumnWidth(3, 140);
  sheet.setColumnWidth(4, 140);

  var row = 4;

  function writeSection(title, bg, items) {
    // Section header
    sheet.getRange(row, 1, 1, 4).merge();
    sheet.getRange(row, 1).setValue('  ' + title);
    sheet.getRange(row, 1).setBackground('#' + bg).setFontColor('#FFFFFF')
      .setFontWeight('bold').setFontFamily('Arial').setFontSize(10)
      .setHorizontalAlignment('left').setVerticalAlignment('middle');
    sheet.setRowHeight(row, 22);
    row++;

    items.forEach(function(item, idx) {
      var bg2 = idx % 2 === 0 ? '#FFFFFF' : '#F8F9FA';
      sheet.getRange(row, 1).setValue(idx+1);
      sheet.getRange(row, 2).setValue(item.label);
      sheet.getRange(row, 3).setValue(item.amount !== null && item.amount !== undefined ? item.amount : '—');
      sheet.getRange(row, 4).setValue(item.status || '');

      sheet.getRange(row, 1, 1, 4).setBackground(bg2).setFontFamily('Arial').setFontSize(10).setVerticalAlignment('middle');
      sheet.getRange(row, 2).setFontWeight('bold');
      if (typeof item.amount === 'number') {
        sheet.getRange(row, 3).setNumberFormat('₱#,##0.00;(₱#,##0.00);"-"').setHorizontalAlignment('right');
        sheet.getRange(row, 3).setFontColor('#' + (item.amtColor || '000000')).setFontWeight('bold');
      }

      // Status cell styling
      var statusCell = sheet.getRange(row, 4);
      statusCell.setHorizontalAlignment('center').setFontWeight('bold');
      if (item.status === 'Paid ✓')      { statusCell.setBackground('#EAF3DE'); statusCell.setFontColor('#1D6A3A'); }
      else if (item.status === 'Due ⚠')  { statusCell.setBackground('#FADBD8'); statusCell.setFontColor('#C0392B'); }
      else if (item.status === 'Upcoming'){ statusCell.setBackground('#D6EAF8'); statusCell.setFontColor('#1A5276'); }

      sheet.setRowHeight(row, 20);
      row++;
    });
  }

  // ── Income this month
  var incThisMonth = (data.income || []).filter(function(i){ return i.monthKey === TODAY_KEY; });
  var totalInc = incThisMonth.reduce(function(s,i){ return s+i.amount; }, 0);
  writeSection('💵 INCOME — ' + todayLabel, '0F6E56',
    incThisMonth.map(function(i){ return {label:i.label, amount:i.amount, status:'', amtColor:'0F6E56'}; })
  );

  // ── Loans due this month
  var loans = data.loans || [];
  var loansDue = loans.filter(function(l){
    return TODAY_KEY >= l.startKey && TODAY_KEY <= l.endKey && !isLoanDone(l);
  });
  var totalLoans = 0;
  writeSection('💳 LOANS DUE — ' + todayLabel, 'C0392B',
    loansDue.map(function(l){
      var amt = getLoanAmt(l, TODAY_KEY);
      var paid = l.paidMonths && l.paidMonths.indexOf(TODAY_KEY) >= 0;
      if (typeof amt === 'number') totalLoans += amt;
      return {
        label: l.vendor + ' (' + l.cat + ')',
        amount: amt,
        status: paid ? 'Paid ✓' : (amt === null ? 'Set amount' : 'Due ⚠'),
        amtColor: paid ? '1D6A3A' : 'C0392B'
      };
    })
  );

  // ── Bills this month
  var bills = (data.bills || []).filter(function(b){ return b.monthKey === TODAY_KEY; });
  var totalBills = bills.reduce(function(s,b){ return s+b.amount; }, 0);
  writeSection('🧾 BILLS DUE — ' + todayLabel, 'D4820A',
    bills.map(function(b){
      return {
        label: b.name + ' (' + b.cat + ')',
        amount: b.amount,
        status: b.paid ? 'Paid ✓' : 'Due ⚠',
        amtColor: b.paid ? '1D6A3A' : 'C0392B'
      };
    })
  );

  // ── Net balance box
  row++;
  var totalDue = totalLoans + totalBills;
  var balance = totalInc - totalDue;

  var summaryData = [
    ['Total Income', totalInc, '#0F6E56'],
    ['Total Loans Due', totalLoans, '#C0392B'],
    ['Total Bills Due', totalBills, '#D4820A'],
    ['NET BALANCE', balance, balance >= 0 ? '#0F6E56' : '#C0392B'],
  ];

  summaryData.forEach(function(item, idx) {
    var isBal = item[0] === 'NET BALANCE';
    sheet.getRange(row, 1, 1, 4).setBackground(isBal ? '#1B2A4A' : (idx%2===0?'#FFFFFF':'#F8F9FA'));
    sheet.getRange(row, 2).setValue(item[0]);
    sheet.getRange(row, 3).setValue(item[1]);
    sheet.getRange(row, 2).setFontWeight('bold').setFontFamily('Arial').setFontSize(isBal?12:10);
    sheet.getRange(row, 3).setFontWeight('bold').setFontFamily('Arial').setFontSize(isBal?12:10)
      .setFontColor(isBal ? '#FFFFFF' : item[2])
      .setNumberFormat('₱#,##0.00;(₱#,##0.00);"-"').setHorizontalAlignment('right');
    if (isBal) sheet.getRange(row, 2).setFontColor('#FFFFFF');
    sheet.setRowHeight(row, isBal ? 26 : 20);
    row++;
  });
}

// ── UTIL ─────────────────────────────────────────────────
function getTodayKey() {
  var now = new Date();
  // Use Manila time
  var manila = new Date(now.toLocaleString('en-US', {timeZone:'Asia/Manila'}));
  var y = manila.getFullYear();
  var m = String(manila.getMonth()+1).padStart(2,'0');
  return y + '-' + m;
}

function monthsBetween(k1, k2) {
  var a = k1.split('-'); var b = k2.split('-');
  return (parseInt(b[0]) - parseInt(a[0])) * 12 + (parseInt(b[1]) - parseInt(a[1]));
}

function isLoanDone(l) {
  var k = l.startKey;
  while (k <= l.endKey) {
    if (!l.paidMonths || l.paidMonths.indexOf(k) < 0) return false;
    var parts = k.split('-');
    var y = parseInt(parts[0]); var m = parseInt(parts[1]);
    m++; if (m > 12) { m = 1; y++; }
    k = y + '-' + String(m).padStart(2,'0');
  }
  return true;
}

function calcTotalPaid(l) {
  return (l.paidMonths || []).reduce(function(s, mk) {
    var amt = getLoanAmt(l, mk);
    return s + (typeof amt === 'number' ? amt : 0);
  }, 0);
}

function copyScript(){
  navigator.clipboard.writeText(getAppsScriptCode()).then(()=>alert('Copied! Now paste it in Apps Script.')).catch(()=>alert('Select all the text in the box and copy manually.'));
}

function saveScriptUrl(){
  const url=document.getElementById('script-url').value.trim();
  D.scriptUrl=url;
  saveAndSync();
  alert(url?'URL saved! Syncing now...':'URL cleared — running in local mode.');
  render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='reibudget-backup-'+TODAY_KEY+'.json';
  a.click();
}

function importData(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const imported=JSON.parse(ev.target.result);
      if(!imported.loans||!imported.income) throw new Error('Invalid file');
      D={...imported,scriptUrl:D.scriptUrl};
      saveAndSync(); render();
      alert('Data imported successfully!');
    }catch(err){alert('Invalid backup file.');}
  };
  reader.readAsText(file);
}

/* ── INIT ── */

function toggleSchedule(id){
  const panel = document.getElementById('sched-'+id);
  const arrow = document.getElementById('sched-arrow-'+id);
  const btn   = document.getElementById('sched-btn-'+id);
  if(!panel) return;
  const open = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  if(arrow) arrow.textContent = open ? '▼' : '▶';
  if(btn) btn.style.color = open ? 'var(--blue)' : 'var(--text2)';
}

  });
